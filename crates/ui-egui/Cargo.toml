[package]
name = "localslides-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local Slides egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
localslides-geom = { workspace = true }
localslides-color = { workspace = true }
localslides-model = { workspace = true }
localslides-fonts = { workspace = true }
localslides-text = { workspace = true }
localslides-render = { workspace = true }
localslides-anim = { workspace = true }
localslides-engine = { workspace = true }
localslides-media = { workspace = true }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
craft-ui = { workspace = true }
craft-window = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }

[dev-dependencies]
skrifa = { workspace = true }
# kittest's own dev-dependencies do not propagate; tests need both font features explicitly.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
