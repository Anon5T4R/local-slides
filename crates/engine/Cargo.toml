[package]
name = "localslides-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local Slides engine: sessions, undo history, selection, the command registry every frontend dispatches through, and pointer tools"

[lints]
workspace = true

[dependencies]
localslides-geom = { workspace = true }
localslides-color = { workspace = true }
localslides-model = { workspace = true }
localslides-fonts = { workspace = true }
localslides-text = { workspace = true }
localslides-render = { workspace = true }
localslides-pdf = { workspace = true }
localslides-format = { workspace = true }
localslides-pptx = { workspace = true }
localslides-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
i_overlay = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
localslides-anim = { workspace = true }
zip = { workspace = true }

# The browser clock for comment timestamps (wasm has no std::time::SystemTime).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

