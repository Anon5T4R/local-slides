[package]
name = "localslides-text"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local Slides text layout: runs to shaped glyph lines with bullets, indents, spacing, alignment, anchoring, autofit and caret hit testing"

[lints]
workspace = true

[dependencies]
localslides-model = { workspace = true }
localslides-geom = { workspace = true }
localslides-color = { workspace = true }
localslides-fonts = { workspace = true }
unicode-linebreak = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-bidi = { workspace = true }
# `is_valid`/`weekday` use chrono every target; `clock` gives the local date and time for date
# fields.
chrono = { workspace = true, features = ["clock"] }
