[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# libs/ holds the vendored forks (egui, winit) and craft-libs: read-only third-party trees, built
# through the path dependencies and [patch.crates-io] below, never part of this workspace.
exclude = ["libs"]
default-members = ["crates/*", "apps/localslides", "apps/localslides-cli"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Anon5T4R/local-slides"

[workspace.dependencies]
# internal
localslides-geom = { path = "crates/geom" }
localslides-color = { path = "crates/color" }
localslides-metafile = { path = "crates/metafile" }
localslides-model = { path = "crates/model" }
localslides-fonts = { path = "crates/fonts" }
localslides-text = { path = "crates/text" }
localslides-render = { path = "crates/render" }
localslides-pdf = { path = "crates/pdf" }
localslides-pptx = { path = "crates/pptx" }
localslides-format = { path = "crates/format" }
localslides-anim = { path = "crates/anim" }
localslides-engine = { path = "crates/engine" }
localslides-mcp = { path = "crates/mcp" }
localslides-ui-egui = { path = "crates/ui-egui" }
localslides-media = { path = "crates/media" }
# codecs (ported from FilmCraft, same owner and licence)
localslides-bitstream = { path = "crates/bitstream" }
localslides-h264 = { path = "crates/h264" }
localslides-hevc = { path = "crates/hevc" }
localslides-vp9 = { path = "crates/vp9" }
localslides-av1 = { path = "crates/av1" }
localslides-isobmff = { path = "crates/isobmff" }
localslides-matroska = { path = "crates/matroska" }
localslides-ogg = { path = "crates/ogg" }
localslides-opus = { path = "crates/opus" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
# Base features are wasm-safe (`std` only). The non-wasm `clock` feature is requested
# per-crate for targets that read the local clock (see crates/text).
chrono = { version = "0.4", default-features = false, features = ["std"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
# The shared crafting libraries, vendored under libs/craft-libs (craft-libs @ c5a1cbf, the rev
# this release pins). Path dependencies: the CI rejects git sources.
craft-media = { path = "libs/craft-libs/crates/media/", version = "=0.1.0", default-features = false }
craft-pdf = { path = "libs/craft-libs/crates/pdf/", version = "=0.1.0", default-features = false, features = ["write", "write-simple-text"] }
# craft-update: app-specific pretend versions apply to startup and manual checks.
craft-update = { path = "libs/craft-libs/crates/update/", version = "=0.1.0", features = ["egui"] }
craft-ui = { path = "libs/craft-libs/crates/ui/", version = "=0.1.0" }
# craft-window drives the native windows: one per open presentation, in the mold of
# the other Crafting Apps. Same vendored craft-libs tree as the crates above.
craft-window = { path = "libs/craft-libs/crates/window/", version = "=0.1.0", default-features = false, features = ["egui"] }
i_overlay = "9"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }

# ui
egui = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
web-time = "1.1"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
type_complexity = "allow"
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

# Line tables keep file and line in panics and backtraces; full debug info
# for every test binary and dependency would multiply the target dir size.
# The test profile inherits both settings.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

[patch.crates-io]
# The vendored forks resolve from libs/ (path sources, so no git is fetched): egui
# 6d518fc799681571963842f95b55a6b68431b15a, winit a517b3846ee8457d84ee4975110bfda6797c44dc and
# craft-libs c5a1cbfb5f9049f9270955caffb5bee5997aebf7 (whose krilla keeps the write-side patches).
krilla = { path = "libs/craft-libs/vendor/krilla" }
ecolor = { path = "libs/egui/crates/ecolor/" }
emath = { path = "libs/egui/crates/emath/" }
epaint = { path = "libs/egui/crates/epaint/" }
epaint_default_fonts = { path = "libs/egui/crates/epaint_default_fonts/" }
egui = { path = "libs/egui/crates/egui/" }
egui-winit = { path = "libs/egui/crates/egui-winit/" }
egui-wgpu = { path = "libs/egui/crates/egui-wgpu/" }
egui_glow = { path = "libs/egui/crates/egui_glow/" }
egui_extras = { path = "libs/egui/crates/egui_extras/" }
egui_kittest = { path = "libs/egui/crates/egui_kittest/" }
egui_system_font_provider = { path = "libs/egui/crates/egui_system_font_provider/" }
eframe = { path = "libs/egui/crates/eframe/" }
egui_demo_lib = { path = "libs/egui/crates/egui_demo_lib/" }
egui_inspection = { path = "libs/egui/crates/egui_inspection/" }
winit = { path = "libs/winit/" }
