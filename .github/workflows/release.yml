name: Release

# Tag vX.Y.Z -> builda Windows (MSI per-machine, MSI per-user e portable) e Linux
# (AppImage, deb, rpm, tar.gz), e publica tudo na GitHub Release da tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: WiX Toolset (v5 + extensões UI/Util, como packaging/windows/package.ps1 espera)
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build e pacote
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/package.ps1
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/release/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependências de empacotamento
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxkbcommon-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libasound2-dev \
            ninja-build mesa-vulkan-drivers zsync
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Build e pacote
        run: packaging/linux/package.sh --formats "appimage deb rpm tar"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/release/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publica a release (idempotente)
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          files=(dist/windows/* dist/linux/* dist/SHA256SUMS.txt)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "Local Slides ${tag}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
