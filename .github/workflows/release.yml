name: Release

# Tag vX.Y.Z -> builda Windows (MSI per-machine, MSI per-user e portable) e Linux
# (AppImage, deb, rpm, tar.gz), e publica tudo na GitHub Release da tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fontes CJK/coreanas (craft-fonts)
        # Mesmo pin do CI e do upstream (deckcraft@9bac60ff). Sem elas o binário sai
        # sem as fontes embutidas ("building without craft-fonts").
        uses: actions/checkout@v7
        with:
          repository: storytold/craft-fonts
          ref: 37827adc41fd165f9a9234ac40f94dbad353aa69
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: WiX Toolset (v5 + extensões UI/Util, como packaging/windows/package.ps1 espera)
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build e pacote
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/package.ps1
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/release/*

  linux:
    runs-on: ubuntu-22.04
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fontes CJK/coreanas (craft-fonts)
        uses: actions/checkout@v7
        with:
          repository: storytold/craft-fonts
          ref: 37827adc41fd165f9a9234ac40f94dbad353aa69
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependências de empacotamento
        run: |
          ok=0
          for try in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && ok=1 && break
            echo "apt: tentativa $try falhou — repetindo em 20s (blip de mirror do runner)"
            sleep 20
          done
          [ "$ok" = 1 ]
          ok=0
          for try in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y pkg-config libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev \
              libxkbcommon-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libasound2-dev \
              ninja-build mesa-vulkan-drivers zsync && ok=1 && break
            echo "apt: tentativa $try falhou — repetindo em 20s (blip de mirror do runner)"
            sleep 20
          done
          [ "$ok" = 1 ]
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Build e pacote
        run: packaging/linux/package.sh --formats "appimage deb rpm tar cli"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/release/*

  arch:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist/release
      - name: Pacote Arch (makepkg a partir do tarball da release)
        run: |
          set -euo pipefail
          # makepkg recusa root: usuário sem privilégio constrói; fakeroot
          # normaliza a posse dos arquivos do pacote.
          pacman -Sy --noconfirm fakeroot >/dev/null
          useradd -m builder
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          work=$(mktemp -d)
          cp packaging/arch/PKGBUILD "$work/"
          cp "dist/release/localslides-$version-linux-x86_64.tar.gz" "$work/localslides-$version-linux-x86_64.tar.gz"
          # Fonte local (a URL da release ainda não existe neste ponto do
          # pipeline) + checksum REAL do artefato em vez de SKIP.
          sha=$(sha256sum "$work/localslides-$version-linux-x86_64.tar.gz" | cut -d' ' -f1)
          sed -i "s|^source=.*|source=(\"localslides-\$pkgver-linux-x86_64.tar.gz\")|; s|^sha256sums=.*|sha256sums=('$sha')|" "$work/PKGBUILD"
          chown -R builder "$work"
          cd "$work"
          su builder -c 'makepkg --noconfirm --noprogressbar -d'
          # Asset no padrao da suite (<id>-<ver>-linux-<arch>): o pacman instala pelo
          # .PKGINFO interno (pkgname=ai.storyteller.localslides), o nome do arquivo e so o contrato do updater.
          mv ai.storyteller.localslides-$version-*.pkg.tar.zst "localslides-$version-linux-x86_64.pkg.tar.zst"
          mv "localslides-$version-linux-x86_64.pkg.tar.zst" "$GITHUB_WORKSPACE/"
          ls -lh "$GITHUB_WORKSPACE"/*.pkg.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: '*.pkg.tar.zst'
          if-no-files-found: error
  publish:
    needs: [windows, linux, arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publica a release (idempotente)
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          files=(dist/windows/* dist/linux/* dist/arch/* dist/SHA256SUMS.txt)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "Local Slides ${tag}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
