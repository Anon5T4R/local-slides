name: CI

# Qualidade em todo push para main e todo PR: fmt, clippy, build --locked e testes.
# Autossuficiente: não depende de workflows de outra organização.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Dependências de build (Linux)
        if: runner.os == 'Linux'
        run: |
          ok=0
          for try in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && ok=1 && break
            echo "apt: tentativa $try falhou — repetindo em 20s (blip de mirror do runner)"
            sleep 20
          done
          [ "$ok" = 1 ]
          ok=0
          for try in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
              libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev \
              libfreetype-dev libasound2-dev mesa-vulkan-drivers fonts-dejavu-core && ok=1 && break
            echo "apt: tentativa $try falhou — repetindo em 20s (blip de mirror do runner)"
            sleep 20
          done
          [ "$ok" = 1 ]
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatação (nightly; só os membros do workspace - libs/ é vendorizado)
        # `cargo fmt --all` também alcança as dependências de path (libs/local-ai, libs/egui,
        # libs/craft-libs), que são espelhos com o estilo de origem: o gate lista os membros via
        # `cargo metadata`. `-p` múltiplo num único `cargo fmt` (lição #46).
        shell: bash
        run: |
          set -euo pipefail
          py=python3
          "$py" -c 'import sys' > /dev/null 2>&1 || py=python
          meta="$(cargo metadata --no-deps --format-version 1)"
          # Windows: o python do runner imprime com \r\n e o mapfile só tira o \n - sem o tr,
          # os -p chegam com \r grudado ("package `localslides\r` is not a member").
          mapfile -t members < <("$py" -c 'import json,sys; print("\n".join(p["name"] for p in json.load(sys.stdin)["packages"]))' <<< "$meta" | tr -d '\r')
          args=()
          for member in "${members[@]}"; do args+=(-p "$member"); done
          cargo +nightly fmt "${args[@]}" -- --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build --locked
        run: cargo build --locked
      - name: Testes
        # Os testes de UI (kittest) abrem um driver de janela; no runner Windows eles
        # colidem quando os binários de teste rodam em paralelo, então lá rodam serial.
        run: cargo test --locked --no-fail-fast ${{ runner.os == 'Windows' && '-- --test-threads=1' || '' }}
        env:
          LOCALSLIDES_REQUIRE_WINRES: ${{ runner.os == 'Windows' && '1' || '' }}

  git-sources:
    name: Sem dependências git remotas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cargo.lock (raiz e craft-libs vendored) não pode ter fontes git+
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "Cargo.lock is missing"; exit 1; }
          cargo metadata --locked --format-version 1 > /dev/null
          python3 - <<'PY'
          import sys, tomllib
          from pathlib import Path
          bad = set()
          for path in ("Cargo.lock", "libs/craft-libs/Cargo.lock"):
              if not Path(path).is_file():
                  continue
              lock = tomllib.load(open(path, "rb"))
              bad |= {f"{path}: {p['source']}" for p in lock.get("package", [])
                      if p.get("source", "").startswith("git+")}
          if bad:
              print("Dependências git encontradas (proibido):", *sorted(bad), sep="\n")
              sys.exit(1)
          PY
