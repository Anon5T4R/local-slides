# Mapeamento de caminhos para sincronização com o upstream (storytold/deckcraft)
#
# Cada entrada traduz um caminho do upstream para o caminho neste repo.
# Arquivos ausentes deste mapa = "não tentar aplicar automaticamente".
# Baseline: deckcraft v0.15.1 = 9bac60ff.
#
# strategy:
#   apply   - o script tenta aplicar via git diff/apply sem revisão de conteúdo
#   review  - o script baixa o diff, mas um humano deve revisar antes de aplicar
#   skip    - o script ignora este arquivo (conflito garantido ou escopo diferente)

[[map]]
upstream = "crates/pptx/**"
local = "crates/pptx/**"
strategy = "review"
note = "leitura/escrita OOXML; paridade com PowerPoint, mas confira o formato nativo e os testes de corpus"

[[map]]
upstream = "crates/engine/src/cmd/**"
local = "crates/engine/src/cmd/**"
strategy = "review"
note = "comandos; ids e rótulos são parte do contrato do CLI, control channel e MCP"

[[map]]
upstream = "crates/engine/src/io.rs"
local = "crates/engine/src/io.rs"
strategy = "apply"
note = "save atômico/recovery, sem marca nem dep"

[[map]]
upstream = "crates/format/src/lib.rs"
local = "crates/format/src/lib.rs"
strategy = "review"
note = "formato nativo .deckcraft mantido byte-a-byte; se o upstream mudar o manifesto, parar e decidir"

[[map]]
upstream = "crates/media/**"
local = "crates/media/**"
strategy = "apply"
note = "codecs e demux; correções de robustez valem direto (fixtures ficam as nossas)"

[[map]]
upstream = "crates/render/**"
local = "crates/render/**"
strategy = "apply"
note = "rasterização (vello_cpu); sem marca"

[[map]]
upstream = "crates/ui-egui/src/lib.rs"
local = "crates/ui-egui/src/lib.rs"
strategy = "review"
note = "UPDATE_APP aponta para suite::LOCALSLIDES; um merge cego devolveria DECKCRAFT"

[[map]]
upstream = "Cargo.toml"
local = "Cargo.toml"
strategy = "skip"
note = "nomes de crate localslides-*, path deps em libs/, [patch.crates-io] e edition 2024"

[[map]]
upstream = "apps/deckcraft/**"
local = "apps/localslides/**"
strategy = "skip"
note = "binário/identidade renomeados; o entry point tem diferenças de rebrand"

[[map]]
upstream = "apps/deckcraft-cli/**"
local = "apps/localslides-cli/**"
strategy = "skip"
note = "CLI renomeada e com links próprios"

[[map]]
upstream = "apps/deckcraft-web/**"
local = "apps/localslides-web/**"
strategy = "skip"
note = "wasm renomeado"

[[map]]
upstream = "packaging/**"
local = "packaging/**"
strategy = "skip"
note = "nosso packaging é o molde da suíte (WiX per-machine/per-user, nfpm/Flatpak próprios)"

[[map]]
upstream = ".github/**"
local = ".github/**"
strategy = "skip"
note = "nosso CI é próprio; não puxar workflows da org storytold"

[[map]]
upstream = "docs/brand/**"
local = "docs/brand/**"
strategy = "skip"
note = "marca ArtCraft; removida no rebrand (diretório não existe mais aqui)"

[[map]]
upstream = "docs/**"
local = "docs/**"
strategy = "review"
note = "docs de paridade acompanham features; README, ROADMAP, NOTICE, ATTRIBUTION e upstream-sync são nossos"

[[map]]
upstream = "ROADMAP.md"
local = "ROADMAP.md"
strategy = "skip"
note = "roadmap do DeckCraft; o nosso evolui separado"

[[map]]
upstream = "contributors/**"
local = "contributors/**"
strategy = "skip"
note = "contributors.json é gerado; people.toml é local"

[[map]]
upstream = "assets/app-icon/**"
local = "assets/app-icon/**"
strategy = "skip"
note = "ícone próprio da suíte (Fase C), não o placeholder do upstream"
